<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Telemetry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Live Telemetry</h1>
    <div id="status" class="status">Disconnected</div>

    <div class="telemetry">
      <div class="row"><span class="name">Speed: </span><span id="speed" class="value">-- km/h</span></div>
      <div class="row"><span class="name">RPM: </span><span id="rpm" class="value">--</span></div>
      <div class="row"><span class="name">Gear: </span><span id="gear" class="value">--</span></div>
      <div class="row"><span class="name">Position X: </span><span id="posx" class="value">--</span></div>
      <div class="row"><span class="name">Position Y: </span><span id="posy" class="value">--</span></div>
      <div class="row"><span class="name">Position Z: </span><span id="posz" class="value">--</span></div>
      <div class="row"><span class="name">Last Lap: </span><span id="lastLap" class="value">--</span></div>
      <div class="row"><span class="name">Best Lap: </span><span id="bestLap" class="value">--</span></div>
      <div class="row"><span class="name">Lap Count: </span><span id="lapCount" class="value">--</span></div>

      <!--Pedal bars for throttle, brake, and clutch with percentage values and visual representation-->
      <div class="row">
        <span class="name">Throttle: </span>
        <span class="pedal-right">
          <span id="throttle" class="value">--%</span>
          <span class="bar-track"><span id="throttleBar" class="bar-fill throttle"></span></span>
        </span>
      </div>
      <div class="row">
        <span class="name">Brake: </span>
        <span class="pedal-right">
          <span id="brake" class="value">--%</span>
          <span class="bar-track"><span id="brakeBar" class="bar-fill brake"></span></span>
        </span>
      </div>
      <div class="row">
        <span class="name">Clutch: </span>
        <span class="pedal-right">
          <span id="clutch" class="value">--%</span>
          <span class="bar-track"><span id="clutchBar" class="bar-fill clutch"></span></span>
        </span>
      </div>
    </div>
  </main>

  <script>
    // Initialize the status element and telemetry fields and parses the JSON data received from the websocket to update the UI
    const status = document.getElementById("status");
    const fields = {
      speed: document.getElementById("speed"),
      rpm: document.getElementById("rpm"),
      gear: document.getElementById("gear"),
      throttle: document.getElementById("throttle"),
      brake: document.getElementById("brake"),
      clutch: document.getElementById("clutch"),
      posx: document.getElementById("posx"),
      posy: document.getElementById("posy"),
      posz: document.getElementById("posz"),
      lastLap: document.getElementById("lastLap"), 
      bestLap: document.getElementById("bestLap"),
      lapCount: document.getElementById("lapCount")
    };

// Handles the formatting for the lap time to display it in a readable format instead of milliseconds
function formatLapTime(ms) {
  if (!ms || ms <= 0) return "--:--.---";
  const m = Math.floor(ms / 60000);
  const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, "0");
  const x = String(Math.floor(ms % 1000)).padStart(3, "0");
  return `${m}:${s}.${x}`;
}

// Connects to the websocket from the script. Checks for connection status. Parses the JSON data from the script and updates the UI 
    function connect() {
      const socket = new WebSocket("ws://localhost:8765");

      // Handles the websocket open event and updates the status to connected
      socket.addEventListener("open", () => {
        status.textContent = "Connected";
        status.classList.add("connected");
      });


      // Handles the incoming messages from the websocket and updates the UI with the telemetry data
      socket.addEventListener("message", (event) => {
        const data = JSON.parse(event.data);

        //The math for the throttle, brake, and clutch percentages ensures that the values are between 0 and 100 to avoid any unexpected behavior in the UI.
        const throttlePct = Math.max(0, Math.min(100, data.throttle * 100));
        const brakePct = Math.max(0, Math.min(100, data.brake * 100));
        const clutchPct = Math.max(0, Math.min(100, (1 - data.clutch) * 100));


        // Updates the UI with the telemetry data received from the websocket
        fields.speed.textContent = `${data.speed.toFixed(1)} km/h`;
        fields.rpm.textContent = data.rpm.toFixed(0);
        fields.gear.textContent = data.gear;
        fields.throttle.textContent = `${(data.throttle * 100).toFixed(0)}%`;
        fields.brake.textContent = `${(data.brake * 100).toFixed(0)}%`;
        fields.clutch.textContent = `${((1 - data.clutch) * 100).toFixed(0)}%`;
        fields.posx.textContent = data.posx.toFixed(1);
        fields.posy.textContent = data.posy.toFixed(1);
        fields.posz.textContent = data.posz.toFixed(1);
        fields.lastLap.textContent = formatLapTime(data.lastLap);
        fields.bestLap.textContent = formatLapTime(data.bestLap);
        fields.lapCount.textContent = data.lapCount.toFixed(0);

        // Updates the pedal bars with the calculated percentages for throttle, brake, and clutch
        fields.throttle.textContent = `${throttlePct.toFixed(0)}%`;
        fields.brake.textContent = `${brakePct.toFixed(0)}%`;
        fields.clutch.textContent = `${clutchPct.toFixed(0)}%`;
        
        bars.throttle.style.width = `${throttlePct}%`;
        bars.brake.style.width = `${brakePct}%`;
        bars.clutch.style.width = `${clutchPct}%`;
      });

      // Handles the websocket close event
      socket.addEventListener("close", () => {
        status.textContent = "Disconnected - Trying to reconnect... Make sure the telemetry ingestor is running.";
        status.classList.remove("connected");
        setTimeout(connect, 2000);
      });

      socket.addEventListener("error", () => {
        socket.close();
      });
    }

    // Initializes the pedal bars for throttle, brake, and clutch
    const bars = {
      throttle: document.getElementById("throttleBar"),
      brake: document.getElementById("brakeBar"),
      clutch: document.getElementById("clutchBar")
    };

    connect();
  </script>
</body>
</html>
